# Dùng trên VPS: nối container frontend vào network của reverse proxy (Caddy của pos-saas)
# để Caddy gọi được http://english-learning-fe:80.
#
# Bật bằng cách thêm vào .env trên VPS:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   PROXY_NETWORK=pos-saas_default      # tên network của container Caddy
services:
  english-learning-fe:
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-pos-saas_default}
